name: Go Worker and Supervisor Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "native/**"
      - "scripts/**"
      - "compat/**"
      - "test/**"
      - "benchmarks/**"
      - "skills/**"
      - "docs/**"
      - "assets/**"
      - "README*.md"
      - "CHANGELOG*.md"
      - "package*.json"
      - ".codex-plugin/**"
      - ".mcp.json"
      - "LICENSE"
      - ".gitattributes"
      - ".gitignore"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional v-prefixed release tag. Leave empty to build without publishing."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: go-worker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  NODE_VERSION: "24.18.0"
  GO_WORKER_ROOT: native/lode-agent-worker
  GO_WORKER_COMMAND: ./cmd/lode-agent-worker
  GO_SUPERVISOR_COMMAND: ./cmd/lode-agent-supervisor
  GO_ARCADEDB_BRIDGE_COMMAND: ./cmd/lode-agent-arcadedb-bridge

jobs:
  prepare:
    name: Prepare build metadata
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
      release_tag: ${{ steps.metadata.outputs.release_tag }}
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up the tested Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Detect Go worker source
        id: detect
        shell: bash
        run: |
          if [[ -f "${GO_WORKER_ROOT}/go.mod" && -d "${GO_WORKER_ROOT}/cmd/lode-agent-worker" && -d "${GO_WORKER_ROOT}/cmd/lode-agent-supervisor" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Go worker source is not present yet; native build jobs are intentionally skipped."
          fi

      - name: Resolve one deterministic workflow version
        id: metadata
        shell: bash
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          release_tag=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [[ -n "${MANUAL_RELEASE_TAG}" ]]; then
            release_tag="${MANUAL_RELEASE_TAG}"
          fi

          if [[ -n "${release_tag}" && ! "${release_tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "release_tag must be a v-prefixed semantic version." >&2
            exit 1
          fi

          source_version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          plugin_version="$(node -p "JSON.parse(require('fs').readFileSync('.codex-plugin/plugin.json', 'utf8')).version")"
          if [[ "${source_version}" != "${plugin_version}" ]]; then
            echo "package.json and plugin.json versions must match." >&2
            exit 1
          fi
          if [[ -n "${release_tag}" ]]; then
            version="${release_tag#v}"
            if [[ "${version}" != "${source_version}" ]]; then
              echo "release_tag must exactly match the source plugin version." >&2
              exit 1
            fi
          else
            version="${source_version}"
          fi

          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

  javascript:
    name: Full JavaScript regression suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up the tested Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Go from the worker module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/lode-agent-worker/go.mod
          cache-dependency-path: native/lode-agent-worker/go.mod
          check-latest: false

      - name: Prepare current-source supervisor fixture
        shell: bash
        run: |
          LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT="${RUNNER_TEMP}/head-agent-test-native"
          echo "LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT=${LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT}" >> "${GITHUB_ENV}"
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          binary_root="${LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT}/dist/linux-x64"
          mkdir -p "${binary_root}"
          (cd native/lode-agent-worker && CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
            -o "${binary_root}/lode-agent-supervisor" ./cmd/lode-agent-supervisor)
          node scripts/generate-process-supervisor-manifest.mjs --platform linux --arch x64 \
            --binary "${binary_root}/lode-agent-supervisor" --output "${binary_root}/SUPERVISOR-MANIFEST.json"

      - name: Run every JavaScript regression test
        run: npm test

  host_smoke:
    name: Execute native install lifecycle on ${{ matrix.os }}
    needs: prepare
    if: ${{ needs.prepare.outputs.enabled == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up the tested Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Set up Go from the worker module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/lode-agent-worker/go.mod
          cache-dependency-path: native/lode-agent-worker/go.mod
          check-latest: false

      - name: Prepare current-source supervisor fixture
        shell: bash
        run: |
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          platform="$(node -p "process.platform")"
          arch="$(node -p "process.arch")"
          goos="$(go env GOOS)"
          LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT="${RUNNER_TEMP}/head-agent-test-native"
          echo "LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT=${LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT}" >> "${GITHUB_ENV}"
          binary_root="${LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT}/dist/${goos}-${arch}"
          executable="lode-agent-supervisor"
          if [[ "${goos}" == "windows" ]]; then executable="${executable}.exe"; fi
          mkdir -p "${binary_root}"
          (cd native/lode-agent-worker && CGO_ENABLED=0 go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X main.version=${version} -X main.commit=${GITHUB_SHA}" \
            -o "${binary_root}/${executable}" ./cmd/lode-agent-supervisor)
          node scripts/generate-process-supervisor-manifest.mjs --platform "${platform}" --arch "${arch}" \
            --binary "${binary_root}/${executable}" --output "${binary_root}/SUPERVISOR-MANIFEST.json"

      # These are executed host binaries; the separate build matrix only cross-builds.
      - name: Verify smoke cleanup, exact result application, and World workflows on the actual host
        run: node --test --test-isolation=none --test-concurrency=1 test/native-smoke-cleanup.test.mjs test/compaction-recovery.test.mjs test/runtime-result-application.test.mjs test/onboarding-world-workflow.test.mjs test/context-compiler.test.mjs

      - name: Build, install, doctor, native health, cleanup, rollback, and uninstall
        run: node scripts/verify-native-host-smoke.mjs

  test:
    name: Test Go worker and supervisor
    needs: prepare
    if: ${{ needs.prepare.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go from the worker module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/lode-agent-worker/go.mod
          cache-dependency-path: native/lode-agent-worker/go.mod
          check-latest: false

      - name: Set up the tested Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify modules
        working-directory: native/lode-agent-worker
        run: go mod verify

      - name: Run tests
        working-directory: native/lode-agent-worker
        run: go test ./...

      - name: Run static analysis
        working-directory: native/lode-agent-worker
        run: go vet ./...

      - name: Verify onboarding authority and recovery contract
        run: node scripts/verify-onboarding.mjs

      - name: Verify ArcadeDB database lifecycle boundary
        run: node scripts/verify-arcadedb-database-lifecycle.mjs

      - name: Verify ArcadeDB incremental sync contract
        run: node scripts/verify-arcadedb-incremental-sync.mjs

      - name: Verify prepared traversal cost identity and no-full-read boundary
        run: npm run benchmark:prepared-traversal -- --iterations 3

      - name: Verify provider-neutral runtime adapter contract matrix
        run: node scripts/verify-runtime-adapters.mjs

      - name: Verify immutable user distribution lifecycle
        run: node scripts/verify-distribution-lifecycle.mjs

      - name: Verify Codex marketplace snapshot packaging
        run: node scripts/verify-codex-marketplace.mjs

      - name: Verify Claude Code marketplace snapshot packaging
        run: node scripts/verify-claude-marketplace.mjs

      - name: Verify isolated historical marketplace ownership boundary
        run: node --test legacy/marketplace-ownership/test/ownership.test.mjs

      - name: Verify automatic native artifact delivery contract
        run: node scripts/verify-native-artifact-delivery.mjs

      - name: Verify README-only newcomer onboarding lifecycle
        run: node scripts/verify-newcomer-readme.mjs

      - name: Verify conversation-native onboarding through typed MCP
        run: node scripts/verify-conversational-onboarding.mjs

      - name: Verify native stdio and JavaScript conformance
        shell: bash
        working-directory: native/lode-agent-worker
        env:
          NATIVE_TEST_ROOT: ${{ runner.temp }}/lode-agent-native-test
        run: |
          binary_root="${NATIVE_TEST_ROOT}/dist/linux-x64"
          mkdir -p "${binary_root}"
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.version }} -X main.commit=${GITHUB_SHA}" \
            -o "${binary_root}/lode-agent-worker" \
            ./cmd/lode-agent-worker
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.version }} -X main.commit=${GITHUB_SHA}" \
            -o "${binary_root}/lode-agent-supervisor" \
            ./cmd/lode-agent-supervisor
          CGO_ENABLED=0 go build \
            -trimpath \
            -buildvcs=false \
            -ldflags="-s -w -X main.version=${{ needs.prepare.outputs.version }} -X main.commit=${GITHUB_SHA}" \
            -o "${binary_root}/lode-agent-arcadedb-bridge" \
            ./cmd/lode-agent-arcadedb-bridge
          chmod 0755 "${binary_root}/lode-agent-worker"
          chmod 0755 "${binary_root}/lode-agent-supervisor"
          chmod 0755 "${binary_root}/lode-agent-arcadedb-bridge"
          node ../../scripts/generate-go-worker-manifest.mjs \
            --platform linux \
            --arch x64 \
            --binary "${binary_root}/lode-agent-worker" \
            --output "${binary_root}/WORKER-MANIFEST.json" \
            --operations "worker.health.v1,worker.lifecycle.v1,repository.scan.v1"
          node ../../scripts/generate-process-supervisor-manifest.mjs \
            --platform linux \
            --arch x64 \
            --binary "${binary_root}/lode-agent-supervisor" \
            --output "${binary_root}/SUPERVISOR-MANIFEST.json"
          node ../../scripts/generate-arcadedb-native-bridge-manifest.mjs \
            --platform linux \
            --arch x64 \
            --binary "${binary_root}/lode-agent-arcadedb-bridge" \
            --output "${binary_root}/ARCADEDB-BRIDGE-MANIFEST.json"
          node ../../scripts/benchmark-arcadedb-query-batch.mjs \
            --native "${binary_root}/lode-agent-arcadedb-bridge" \
            --iterations 10 \
            --require-activation-threshold
          node ../../scripts/verify-go-worker.mjs --plugin-root "${NATIVE_TEST_ROOT}"
          node ../../scripts/verify-process-supervisor.mjs --plugin-root "${NATIVE_TEST_ROOT}"
          LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT="${NATIVE_TEST_ROOT}" \
            node ../../scripts/verify-runtime-invocation-lifecycle.mjs
          LODE_AGENT_PROCESS_SUPERVISOR_FIXTURE_ROOT="${NATIVE_TEST_ROOT}" \
            node ../../scripts/verify-provider-replacement-recovery.mjs

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs:
      - prepare
      - test
      - javascript
    if: ${{ needs.prepare.outputs.enabled == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runtime_platform: linux
            runtime_arch: x64
            runtime_dir: linux-x64
            package: lode-agent-worker-linux-amd64
            executable: lode-agent-worker
            supervisor_executable: lode-agent-supervisor
            bridge_executable: lode-agent-arcadedb-bridge
          - goos: linux
            goarch: arm64
            runtime_platform: linux
            runtime_arch: arm64
            runtime_dir: linux-arm64
            package: lode-agent-worker-linux-arm64
            executable: lode-agent-worker
            supervisor_executable: lode-agent-supervisor
            bridge_executable: lode-agent-arcadedb-bridge
          - goos: darwin
            goarch: amd64
            runtime_platform: darwin
            runtime_arch: x64
            runtime_dir: darwin-x64
            package: lode-agent-worker-darwin-amd64
            executable: lode-agent-worker
            supervisor_executable: lode-agent-supervisor
            bridge_executable: lode-agent-arcadedb-bridge
          - goos: darwin
            goarch: arm64
            runtime_platform: darwin
            runtime_arch: arm64
            runtime_dir: darwin-arm64
            package: lode-agent-worker-darwin-arm64
            executable: lode-agent-worker
            supervisor_executable: lode-agent-supervisor
            bridge_executable: lode-agent-arcadedb-bridge
          - goos: windows
            goarch: amd64
            runtime_platform: win32
            runtime_arch: x64
            runtime_dir: windows-x64
            package: lode-agent-worker-windows-amd64
            executable: lode-agent-worker.exe
            supervisor_executable: lode-agent-supervisor.exe
            bridge_executable: lode-agent-arcadedb-bridge.exe

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Go from the worker module
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: native/lode-agent-worker/go.mod
          cache-dependency-path: native/lode-agent-worker/go.mod
          check-latest: false

      - name: Set up the tested Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Build and package worker and supervisor
        shell: bash
        working-directory: native/lode-agent-worker
        env:
          BUILD_VERSION: ${{ needs.prepare.outputs.version }}
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          PACKAGE_NAME: ${{ matrix.package }}
          EXECUTABLE_NAME: ${{ matrix.executable }}
          SUPERVISOR_EXECUTABLE_NAME: ${{ matrix.supervisor_executable }}
          ARCADEDB_BRIDGE_EXECUTABLE_NAME: ${{ matrix.bridge_executable }}
          RUNTIME_PLATFORM: ${{ matrix.runtime_platform }}
          RUNTIME_ARCH: ${{ matrix.runtime_arch }}
          RUNTIME_DIRECTORY: ${{ matrix.runtime_dir }}
        run: |
          package_root="${RUNNER_TEMP}/${RUNTIME_DIRECTORY}"
          output_root="${GITHUB_WORKSPACE}/release-assets"
          mkdir -p "${package_root}" "${output_root}"

          CGO_ENABLED=0 GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}" \
            go build \
              -trimpath \
              -buildvcs=false \
              -ldflags="-s -w -X main.version=${BUILD_VERSION} -X main.commit=${GITHUB_SHA}" \
              -o "${package_root}/${EXECUTABLE_NAME}" \
              "${GO_WORKER_COMMAND}"

          CGO_ENABLED=0 GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}" \
            go build \
              -trimpath \
              -buildvcs=false \
              -ldflags="-s -w -X main.version=${BUILD_VERSION} -X main.commit=${GITHUB_SHA}" \
              -o "${package_root}/${SUPERVISOR_EXECUTABLE_NAME}" \
              "${GO_SUPERVISOR_COMMAND}"

          CGO_ENABLED=0 GOOS="${TARGET_GOOS}" GOARCH="${TARGET_GOARCH}" \
            go build \
              -trimpath \
              -buildvcs=false \
              -ldflags="-s -w -X main.version=${BUILD_VERSION} -X main.commit=${GITHUB_SHA}" \
              -o "${package_root}/${ARCADEDB_BRIDGE_EXECUTABLE_NAME}" \
              "${GO_ARCADEDB_BRIDGE_COMMAND}"

          if [[ "${TARGET_GOOS}" != "windows" ]]; then
            chmod 0755 "${package_root}/${EXECUTABLE_NAME}"
            chmod 0755 "${package_root}/${SUPERVISOR_EXECUTABLE_NAME}"
            chmod 0755 "${package_root}/${ARCADEDB_BRIDGE_EXECUTABLE_NAME}"
          fi

          printf '{\n  "version": "%s",\n  "commit": "%s",\n  "goos": "%s",\n  "goarch": "%s",\n  "cgoEnabled": false\n}\n' \
            "${BUILD_VERSION}" "${GITHUB_SHA}" "${TARGET_GOOS}" "${TARGET_GOARCH}" \
            > "${package_root}/BUILD-METADATA.json"

          node ../../scripts/generate-go-worker-manifest.mjs \
            --platform "${RUNTIME_PLATFORM}" \
            --arch "${RUNTIME_ARCH}" \
            --binary "${package_root}/${EXECUTABLE_NAME}" \
            --output "${package_root}/WORKER-MANIFEST.json"

          node ../../scripts/generate-process-supervisor-manifest.mjs \
            --platform "${RUNTIME_PLATFORM}" \
            --arch "${RUNTIME_ARCH}" \
            --binary "${package_root}/${SUPERVISOR_EXECUTABLE_NAME}" \
            --output "${package_root}/SUPERVISOR-MANIFEST.json"

          node ../../scripts/generate-arcadedb-native-bridge-manifest.mjs \
            --platform "${RUNTIME_PLATFORM}" \
            --arch "${RUNTIME_ARCH}" \
            --binary "${package_root}/${ARCADEDB_BRIDGE_EXECUTABLE_NAME}" \
            --output "${package_root}/ARCADEDB-BRIDGE-MANIFEST.json"

          # One strict tar.gz shape keeps installer verification identical on every OS,
          # including Windows binaries cross-compiled on this Linux runner.
          cp "${GITHUB_WORKSPACE}/native/GO-NOTICES.txt" "${package_root}/GO-NOTICES.txt"
          tar -C "$(dirname "${package_root}")" -czf "${output_root}/${PACKAGE_NAME}.tar.gz" "${RUNTIME_DIRECTORY}"

      - name: Upload immutable matrix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.package }}
          path: release-assets/${{ matrix.package }}.*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish one GitHub Release
    concurrency:
      group: immutable-release-${{ needs.prepare.outputs.release_tag }}
      cancel-in-progress: false
    needs:
      - prepare
      - build
      - javascript
      - host_smoke
    if: ${{ needs.prepare.outputs.enabled == 'true' && needs.prepare.outputs.release_tag != '' && needs.build.result == 'success' && needs.javascript.result == 'success' && needs.host_smoke.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout verified release source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up the tested Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Preserve an already published release and immutable tag
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-publication-version.mjs --provider release --repository "${GITHUB_REPOSITORY}" --source-commit "${GITHUB_SHA}"

      - name: Download every platform artifact
        if: ${{ steps.publication.outputs.action == 'publish' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lode-agent-worker-*
          path: release-assets
          merge-multiple: true

      - name: Generate release checksums
        if: ${{ steps.publication.outputs.action == 'publish' }}
        shell: bash
        working-directory: release-assets
        run: sha256sum lode-agent-worker-* > SHA256SUMS

      - name: Publish release once after all builds succeed
        if: ${{ steps.publication.outputs.action == 'publish' }}
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          tag_name: ${{ needs.prepare.outputs.release_tag }}
          target_commitish: ${{ github.sha }}
          name: Lode Agent Core ${{ needs.prepare.outputs.release_tag }}
          body: |
            Beta release of the provider-neutral Lode Agent Core plugin under the MIT License.

            The beta scope covers the constitutional Core, recovery, Context Compiler, execution
            lineage, local projections, bounded workers, and verified Codex/Claude distribution.
            Experimental, Planned, and Deferred capabilities remain outside this beta claim.

            Source commit: `${{ github.sha }}`

            The attached binaries provide the verified native compute transport, process supervisor, and
            read-only ArcadeDB bridge. They do not replace Product Canon,
            ReviewDecision authority, or the JavaScript control plane. The separate supervisor binary
            provides OS-enforced descendant-tree ownership for bounded provider execution.
            The separate ArcadeDB bridge batches read-only query transport while JavaScript retains
            semantic, snapshot, provenance, and authority verification.
          prerelease: ${{ contains(needs.prepare.outputs.release_tag, '-') }}
          fail_on_unmatched_files: true
          files: |
            release-assets/lode-agent-worker-*
            release-assets/SHA256SUMS

  marketplace:
    name: Publish verified Codex marketplace snapshot (${{ matrix.identity }})
    needs:
      - prepare
      - test
      - build
      - javascript
      - host_smoke
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.prepare.outputs.enabled == 'true' && needs.test.result == 'success' && needs.build.result == 'success' && needs.javascript.result == 'success' && needs.host_smoke.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - identity: lode
            marketplace_name: lode-agent-plugin
            branch: lode-codex-marketplace
          - identity: head
            marketplace_name: head-agent-plugin
            branch: codex-marketplace
    permissions:
      contents: write
    env:
      MARKETPLACE_BRANCH: ${{ matrix.branch }}
      MARKETPLACE_NAME: ${{ matrix.marketplace_name }}
    steps:
      - name: Checkout verified source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Set up the tested Node runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download every verified native platform artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: lode-agent-worker-*
          path: ${{ runner.temp }}/lode-agent-native-artifacts
          merge-multiple: true

      - name: Assemble one integrity-verified native bundle
        shell: bash
        run: |
          native_root="${RUNNER_TEMP}/lode-agent-native-bundle"
          echo "NATIVE_ROOT=${native_root}" >> "${GITHUB_ENV}"
          node scripts/assemble-native-bundle.mjs \
            --artifacts "${RUNNER_TEMP}/lode-agent-native-artifacts" \
            --output "${native_root}" \
            --version "${{ needs.prepare.outputs.version }}" \
            --commit "${GITHUB_SHA}"

      - name: Build content-verified marketplace snapshot
        shell: bash
        run: |
          marketplace_root="${RUNNER_TEMP}/head-agent-codex-marketplace"
          echo "MARKETPLACE_ROOT=${marketplace_root}" >> "${GITHUB_ENV}"
          node scripts/build-codex-marketplace.mjs \
            --marketplace-name "${MARKETPLACE_NAME}" \
            --output "${marketplace_root}" \
            --source-repository "${GITHUB_REPOSITORY}" \
            --source-commit "${GITHUB_SHA}" \
            --native-root "${NATIVE_ROOT}"
          node scripts/verify-codex-marketplace.mjs \
            --root "${marketplace_root}" \
            --expected-repository "${GITHUB_REPOSITORY}" \
            --expected-marketplace-name "${MARKETPLACE_NAME}" \
            --require-native

      - name: Refuse to replace an unowned marketplace branch
        id: ownership
        shell: bash
        run: |
          expected_sha=""
          if git ls-remote --exit-code --heads origin "${MARKETPLACE_BRANCH}" >/dev/null 2>&1; then
            git fetch --no-tags origin "refs/heads/${MARKETPLACE_BRANCH}"
            expected_sha="$(git rev-parse FETCH_HEAD)"
            previous_root="${RUNNER_TEMP}/previous-head-agent-marketplace"
            mkdir -p "${previous_root}"
            git archive FETCH_HEAD | tar -x -C "${previous_root}"
            # One exact predecessor published before the owner-approved repository rename.
            # Verify its original repository and bytes, never rewrite historical markers.
            previous_repository="${GITHUB_REPOSITORY}"
            if [[ "${MARKETPLACE_NAME}" == "head-agent-plugin" && "${GITHUB_REPOSITORY}" == "binary1215/lode" && "${expected_sha}" == "d0b9b6bee9e6aaed5c76de1c881520067d61e985" ]]; then
              previous_repository="binary1215/head-agent-plugin"
            fi
            if ! node scripts/verify-codex-marketplace.mjs \
              --root "${previous_root}" \
              --expected-repository "${previous_repository}" \
              --expected-marketplace-name "${MARKETPLACE_NAME}"; then
              # Historical exceptions belong only to the existing HEAD address.
              if [[ "${MARKETPLACE_NAME}" != "head-agent-plugin" ]]; then exit 1; fi
              node scripts/verify-codex-marketplace.mjs \
                --root "${previous_root}" \
                --expected-repository "${previous_repository}" \
                --expected-marketplace-name "head-agent-plugin" \
                --allow-legacy-byte-preservation \
                --allow-legacy-interface-for-ownership || \
              node legacy/marketplace-ownership/verify.mjs \
                --provider codex \
                --root "${previous_root}" \
                --expected-repository "${previous_repository}" \
                --expected-marketplace-name "head-agent-plugin" \
                --expected-snapshot-commit "${expected_sha}"
            fi
          fi
          echo "expected_sha=${expected_sha}" >> "${GITHUB_OUTPUT}"
          echo "previous_root=${previous_root:-}" >> "${GITHUB_OUTPUT}"

      - name: Require a new version for a changed Codex payload
        id: publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_ROOT: ${{ steps.ownership.outputs.previous_root }}
          PREVIOUS_COMMIT: ${{ steps.ownership.outputs.expected_sha }}
        run: |
          args=()
          if [[ -n "${PREVIOUS_ROOT}" ]]; then args+=(--previous-root "${PREVIOUS_ROOT}" --previous-commit "${PREVIOUS_COMMIT}"); fi
          node scripts/verify-publication-version.mjs \
            --provider codex --root "${MARKETPLACE_ROOT}" \
            --repository "${GITHUB_REPOSITORY}" --marketplace-name "${MARKETPLACE_NAME}" \
            --source-commit "${GITHUB_SHA}" "${args[@]}"

      - name: Publish one generated marketplace branch
        if: ${{ steps.publication.outputs.action == 'publish' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.ownership.outputs.expected_sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan codex-marketplace-publish
          git rm -rf .
          cp -a "${MARKETPLACE_ROOT}/." .
          git add -A
          git commit -m "chore: publish Codex marketplace from ${GITHUB_SHA}"
          if [[ -n "${EXPECTED_SHA}" ]]; then
            git push \
              --force-with-lease="refs/heads/${MARKETPLACE_BRANCH}:${EXPECTED_SHA}" \
              origin "HEAD:refs/heads/${MARKETPLACE_BRANCH}"
          else
            git push origin "HEAD:refs/heads/${MARKETPLACE_BRANCH}"
          fi

  claude_marketplace:
    name: Publish verified Claude Code marketplace snapshot (${{ matrix.identity }})
    needs:
      - prepare
      - test
      - build
      - javascript
      - host_smoke
